name = "DensityHalesJewett"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DensityHalesJewett", "Challenge", "Solution"]
lintDriver = "batteries/runLinter"
lintDriverArgs = ["DensityHalesJewett"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Shelah's bound for the Hales--Jewett numbers.
[[require]]
name = "ShelahHalesJewett"
git = "https://github.com/gdahia/ShelahHalesJewett"
rev = "8a91fc0e8a9617f8ade16ccb3b56e543990c9f45"

# Keep Mathlib last so that its pin takes precedence.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "DensityHalesJewett"

# The Palomar Challenge statement module: it must depend on Mathlib alone.
[[lean_lib]]
name = "Challenge"

# The Palomar Solution module: same declarations, proved from this development.
[[lean_lib]]
name = "Solution"
