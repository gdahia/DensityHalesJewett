version: "v0.4"

project:
  name: The density Hales–Jewett theorem and Szemerédi's theorem
  description: >-
    A Lean 4 formalization of the density Hales–Jewett theorem: for every finite alphabet α
    and every density δ > 0, all sufficiently large n have the property that any set of at
    least δ·|α|^n words of length n over α contains a combinatorial line. The basis for the
    formalization is the combinatorial proof of Dodos, Kanellopoulos, and Tyros. As a
    consequence, we also formalize Szemerédi's theorem on the integers: for every k ≥ 3 and
    δ > 0, the following holds for all sufficiently large n. Any subset of {0, …, n−1} of
    size at least δ·n contains a nonconstant arithmetic progression of length k.
  authors:
    - Gabriel Dahia
  license: Apache-2.0
  responsible_maintainers:
    - Gabriel Dahia

classification:
  arxiv: [math.CO]
  msc2020: [05D10, 05A05, 11B75, 68R15]

sources:
  - title: A Simple Proof of the Density Hales--Jewett Theorem
    authors:
      - Pandelis Dodos
      - Vassilis Kanellopoulos
      - Konstantinos Tyros
    id: https://doi.org/10.1093/imrn/rnt041
    type: paper
    location: >-
      International Mathematics Research Notices 2014(12), 3340--3352; preprint at
      https://arxiv.org/abs/1209.4986
    relationship: formalizes
    license: unknown
    author_endorsement: not-contacted
    note: >-
      The formalization follows this paper's density-increment argument. The stated theorem is the
      same but the explicit constants differ, as recorded under `fidelity`.
  - title: Ramsey's theorem for n-parameter sets
    authors:
      - Ronald L. Graham
      - Bruce L. Rothschild
    id: https://doi.org/10.2307/1995354
    type: paper
    location: Transactions of the American Mathematical Society 159 (1971), 257--292
    relationship: background
    license: unknown
    author_endorsement: not-contacted
    note: >-
      Source of the Graham--Rothschild line-canonization statement that the paper cites as
      background and that this development proves internally.

  - title: Primitive recursive bounds for van der Waerden numbers
    authors:
      - Saharon Shelah
    id: https://doi.org/10.1090/S0894-0347-1988-0929498-X
    type: paper
    location: Journal of the American Mathematical Society 1 (1988), 683--697
    relationship: background
    license: unknown
    author_endorsement: not-contacted
    note: >-
      Source of the bound for the Hales--Jewett numbers on which the explicit thresholds are
      built. Its formalization is in the separate project
      https://github.com/gdahia/ShelahHalesJewett.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Mathlib has `Combinatorics.Line` and the colouring Hales--Jewett theorem, which this
      development uses and on which the compared statements are phrased. Mathlib does not contain
      the density version; that is what this repository adds. The colouring theorem is used with
      Shelah's bound, from the separate project `ShelahHalesJewett`.
  - id: https://github.com/gdahia/ShelahHalesJewett
    relationship: builds-on
    note: >-
      Shelah's bound for the Hales--Jewett numbers and its bound by the Ackermann function. The
      explicit thresholds of this development are built on it.

status:
  scope: >-
    The density Hales--Jewett theorem and Szemerédi's theorem on the integers are proved in full,
    with no `sorry` outside the deliberate holes in `Challenge.lean`. Both are stated in
    `Challenge.lean` with explicit thresholds. The formalization also includes the finite-unions
    theorem, the Graham--Rothschild theorem for combinatorial lines, block canonization, and
    Varnavides' averaging argument, none of which are among the compared declarations. The
    thresholds of all three density statements are stated with the Ackermann function. Szemerédi's
    theorem is formalized for subsets of an initial segment of the naturals only; no version for
    general abelian groups or for the primes is included.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: Combinatorics.Line.exists_of_density
      file: DensityHalesJewett/Main.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
    - declaration: Combinatorics.ArithmeticProgression.exists_of_density_nat
      file: DensityHalesJewett/Main.lean
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound

