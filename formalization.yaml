fidelity:
  divergences: |-
    - The paper sets `eta = delta * theta / 48` and `gamma = delta * eta^2 / k`. The formalization
      replaces these by smaller minima that also enforce `eta <= theta / 4`, `eta <= delta / 6`,
      `gamma <= eta^2 / 2`, and `gamma <= 3 * eta`. Consequently its numerical thresholds and
      density increment are weaker, while the qualitative theorem is unchanged.
    - The main statements have explicit thresholds: density Hales--Jewett over `k` letters holds
      in every dimension `n >= ack (4 * k) (k + ceil (1 / delta))`, for Mathlib's Ackermann
      function `ack`. `Ackermann.lean` obtains this from the dimensions of the formalized proof
      rather than from the paper's displayed bounds (`M_0`, `F`, and `N`), and it bounds the
      Graham--Rothschild numbers, which the paper cites, through Shelah's bound for the
      Hales--Jewett numbers. The level `4 * k` is not optimized. The compared statements have
      these thresholds, so the paper's theorems, which are stated for all sufficiently large `n`,
      follow from them.
    - The induction on the alphabet carries a bound `F` for density Hales--Jewett over `k`
      letters, and the dimension of every intermediate lemma is explicit in `F`. The density
      increment is stated for a family of any density `rho >= delta`, with the dimensions and
      the increment computed at `delta`, so iterating it needs no monotonicity of the bounds in
      the density.

review:
  status: self-assessed
  reviewers:
    - Gabriel Dahia
  notes: >-
    Reviewed by the author for mathematical correctness, including a statement audit of the two
    compared declarations against the cited paper. The author also lightly reviewed the style of
    every proof. No independent reviewer has checked the
    development, and there is no novelty, as the theorems are known results. The
    only contribution is the formalization.

alignment:
  namespace: Combinatorics
  statements:
    - source: Density Hales--Jewett theorem
      lean: Combinatorics.Line.exists_of_density'
      module: Challenge
      status: proved
      note: >-
        The same statement as `Combinatorics.Line.exists_of_density` in
        `DensityHalesJewett/Main.lean`, with the threshold `ack (4 * k) (k + ceil (1 / delta))`.
    - source: Szemerédi's theorem (derived consequence)
      lean: Combinatorics.ArithmeticProgression.exists_of_density_nat'
      module: Challenge
      status: proved
      note: >-
        `Combinatorics.ArithmeticProgression.exists_of_density_nat` in
        `DensityHalesJewett/Main.lean`, with the progression given by its first term and common
        difference and the threshold `ack (4 * k + 1) (k + ceil (1 / delta))`.

acknowledgements: >-
  Built on Mathlib, which provides, among many other things, `Combinatorics.Line` and a proof of
